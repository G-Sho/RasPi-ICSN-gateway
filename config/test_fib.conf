# ICSN Gateway 初期 FIB 設定ファイル
# テストトポロジー: gateway -> bridge -> sensor(A) -> sensor(B) -> sensor(C)
#
# フォーマット: <コンテンツプレフィックス> <次ホップMACアドレス>
#   コメント行は # で始める。空行は無視される。
#
# 【責務分担】
#   - gateway (このファイル): 「次ホップ = bridge」だけを決定する。
#     センサー A/B/C 宛の Interest はすべて bridge 経由で転送する。
#   - bridge (ESP32-ICSN-bridge): 「次ホップ = sensor(A)」を決定する。
#     gateway から受け取った Interest を sensor(A) へ ESP-NOW で転送する。
#   - sensor(A) (ESP32-ICSN-sensor-node): 「次ホップ = sensor(B)」を決定する。
#   - sensor(B): 「次ホップ = sensor(C)」を決定する。
#   - sensor(C): 末端ノード（データ発信源）。
#
# 【テスト用 MAC アドレス】
#   bridge  : 08:D1:F9:37:39:C0
#   sensor A: CC:7B:5C:9A:F3:C4
#   sensor B: CC:7B:5C:9A:F3:AC
#   sensor C: 9C:9C:1F:CF:F4:8C
#
# gateway は bridge の MAC アドレスしか直接知らない。
# /icsn プレフィックスへの最長プレフィックス一致により、
# sensor A/B/C 宛のすべての Interest が bridge へ転送される。

/icsn 08:D1:F9:37:39:C0
