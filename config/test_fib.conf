# ICSN Gateway 初期 FIB 設定ファイル
# テストトポロジー: Cefore(PC) -> gateway(RasPi) -> bridge -> sensor(A) -> sensor(B) -> sensor(C)
#
# フォーマット: <コンテンツプレフィックス> <次ホップMACアドレス>
#   コメント行は # で始める。空行は無視される。
#
# 【責務分担】
#   - gateway, bridge: gateway の FIB を用いて「次ホップ = sensor(A)」を決定する。
#     bridge は sensor(A) へ転送するための MAC アドレスを gateway から受け取る。
#   - sensor(A): (ESP32-ICSN-sensor-node): データ発信源。Interest に応じてデータを返す。
#   - sensor(B): (ESP32-ICSN-sensor-node):
#   - sensor(C): (ESP32-ICSN-sensor-node):
#
# 【テスト用 MAC アドレス】
#   sensor A: CC:7B:5C:9A:F3:C4
#   sensor B: CC:7B:5C:9A:F3:AC
#   sensor C: 9C:9C:1F:CF:F4:8C
#   bridge: 08:D1:F9:37:39:C0
#
# /iot/buildingA/room101/temp への Interest が FIB により sensor A へ転送される。
# calculateDepth("/iot/buildingA/room101/temp") = 4 のため、
# Stage-1 LPM は深さ4のプレフィックスで完全一致 "/iot/buildingA/room101/temp" を試みるが、
# Interest の content_name は removeTimestamp() により "/iot/buildingA/room101" (depth=3) になるため、
# FIBキーも "/iot/buildingA/room101" (3コンポーネント) を登録する。

/iot/buildingA/room101 CC:7B:5C:9A:F3:C4
